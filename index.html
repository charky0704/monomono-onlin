<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONOMONO ONLINE</title>

<style>
.screen {
  display: none;
  width: 100%;
  height: 100vh;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.screen.active {
  display: flex;
}

button {
  padding: 10px 20px;
  margin: 5px;
  cursor: pointer;
}
</style>

</head>

<body>

<!-- START画面 -->
<div id="start" class="screen active">
  <h1>MONOMONO ONLINE</h1>
  <button onclick="goCreate()">NEW GAME</button>
  <button onclick="loadGame()">CONTINUE</button>
</div>

<!-- キャラ作成 -->
<div id="create" class="screen">
  <h2>CREATE CHARACTER</h2>
  <input id="name" placeholder="NAME"><br><br>
  <input type="file" id="img"><br><br>
  <button onclick="createPlayer()">START</button>
  <p>残りポイント: <span id="point">20</span></p>

<player>
STR <button onclick="subStat('str')">-</button>
<span id="strVal">0</span>
<button onclick="addStat('str')">+</button>
</player>

<player>
VIT <button onclick="subStat('vit')">-</button>
<span id="vitVal">0</span>
<button onclick="addStat('vit')">+</button>
</player>

<player>
AGI <button onclick="subStat('agi')">-</button>
<span id="agiVal">0</span>
<button onclick="addStat('agi')">+</button>
</player>

<player>
INT <button onclick="subStat('int')">-</button>
<span id="intVal">0</span>
<button onclick="addStat('int')">+</button>
</player>
</div>

<!-- メニュー画面 -->
<div id="menu" class="screen">
  <div class="ui">

    <!-- 左：ステータス -->
    <div class="panel left">
      <h3>ステータス</h3>
      <img id="charImg">
      <div id="status"></div>
    </div>

    <!-- 右：メニュー -->
    <div class="panel right">

  <button onclick="exploreArea()">探索</button>
  <button onclick="openFriends()">フレンド</button>
  <button onclick="openPvP()">対戦</button>
  <button onclick="openRaid()">レイド</button>

</div>
<!-- 戦闘画面 -->
<div id="battle" class="screen">

  <div id="battleTop">
    <div class="unit">
      <img id="pimg">
      <div id="pname"></div>
      <div class="bar"><div id="php"></div></div>
    </div>

    <div class="vs">VS</div>

    <div class="unit">
      <div id="ename"></div>
      <div class="bar"><div id="ehp"></div></div>
    </div>
  </div>

  <!-- ★これがログ -->
  <div id="log"></div>

</div>
  </div>

</div>
<script src="game.js"></script>
<script src="battle.js"></script>
</body>
</html>
