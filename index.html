<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MONOMONO ONLINE</title>

<style>
.screen {
  display: none;
  width: 100%;
  height: 100vh;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.screen.active {
  display: flex;
}

button {
  padding: 10px 20px;
  margin: 5px;
  cursor: pointer;
}
</style>

</head>

<body>

<!-- START画面 -->
<div id="start" class="screen active">
  <h1>MONOMONO ONLINE</h1>
  <button onclick="goCreate()">NEW GAME</button>
  <button onclick="loadGame()">CONTINUE</button>
</div>

<!-- キャラ作成 -->
<div id="create" class="screen">
  <h2>CREATE CHARACTER</h2>
  <input id="name" placeholder="NAME"><br><br>
  <input type="file" id="img"><br><br>
  <button onclick="createPlayer()">START</button>
</div>

<!-- メニュー画面 -->
<div id="menu" class="screen">
  <div class="ui">

    <!-- 左：ステータス -->
    <div class="panel left">
      <h3>ステータス</h3>
      <img id="charImg">
      <div id="status"></div>
    </div>

    <!-- 右：メニュー -->
    <div class="panel right">
      <h3>行動メニュー</h3>

      <button>街に行く</button>
      <button>合成</button>
      <button>戦闘</button>
      <button>依頼</button>
    </div>

  </div>

</div>
<script src="game.js"></script>
</body>
</html>
